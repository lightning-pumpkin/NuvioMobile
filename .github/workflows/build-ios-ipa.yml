name: Build iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize MPVKit submodule only
        shell: bash
        run: |
          set -euo pipefail

          echo "Synchronizing MPVKit submodule..."
          git submodule sync -- MPVKit

          echo "Initializing MPVKit without nested submodules..."
          git submodule update \
            --init \
            --force \
            --depth 1 \
            --single-branch \
            -- MPVKit

          if [[ ! -f "MPVKit/Package.swift" ]]; then
            echo "::error::MPVKit/Package.swift was not found"

            echo "MPVKit submodule status:"
            git submodule status -- MPVKit || true

            echo "MPVKit directory contents:"
            find MPVKit -maxdepth 3 -print || true

            exit 1
          fi

          echo "MPVKit initialized successfully:"
          git -C MPVKit rev-parse HEAD

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail

          sudo xcode-select \
            -s /Applications/Xcode_16.4.app/Contents/Developer

          xcodebuild -version
          swift --version

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Create local.properties
        shell: bash
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NUVIO_REALTIME_SYNC_ENABLED: ${{ secrets.NUVIO_REALTIME_SYNC_ENABLED }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL: ${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          set -euo pipefail

          {
            printf 'NUVIO_SUPABASE_URL=%s\n' "${NUVIO_SUPABASE_URL:-}"
            printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "${NUVIO_SUPABASE_ANON_KEY:-}"
            printf 'NUVIO_SUPABASE_FALLBACK_URL=%s\n' "${NUVIO_SUPABASE_FALLBACK_URL:-}"
            printf 'SENTRY_DSN=%s\n' "${SENTRY_DSN:-}"
            printf 'NUVIO_REALTIME_SYNC_ENABLED=%s\n' \
              "${NUVIO_REALTIME_SYNC_ENABLED:-true}"

            printf 'TRAKT_CLIENT_ID=%s\n' "${TRAKT_CLIENT_ID:-}"
            printf 'TRAKT_CLIENT_SECRET=%s\n' "${TRAKT_CLIENT_SECRET:-}"
            printf 'TRAKT_REDIRECT_URI=%s\n' \
              "${TRAKT_REDIRECT_URI:-nuvio://auth/trakt}"

            printf 'INTRODB_API_URL=%s\n' "${INTRODB_API_URL:-}"
            printf 'IMDB_RATINGS_API_BASE_URL=%s\n' \
              "${IMDB_RATINGS_API_BASE_URL:-}"
            printf 'IMDB_TAPFRAME_API_BASE_URL=%s\n' \
              "${IMDB_TAPFRAME_API_BASE_URL:-}"
            printf 'PREMIUMIZE_CLIENT_ID=%s\n' \
              "${PREMIUMIZE_CLIENT_ID:-}"

            printf 'CONTRIBUTIONS_URL=%s\n' "${CONTRIBUTIONS_URL:-}"
            printf 'DONATIONS_BASE_URL=%s\n' "${DONATIONS_BASE_URL:-}"
            printf 'DONATIONS_DONATE_URL=%s\n' \
              "${DONATIONS_DONATE_URL:-}"
          } > local.properties

          test -f local.properties

          echo "local.properties created."
          echo "Configured property names:"
          sed 's/=.*$/=<redacted>/' local.properties

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "gradlew"
            "local.properties"
            "MPVKit/Package.swift"
            "iosApp/iosApp.xcodeproj/project.pbxproj"
            "iosApp/iosApp.xcodeproj/xcshareddata/xcschemes/iosApp.xcscheme"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi
          done

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            | tee "$RUNNER_TEMP/resolve-packages.log"

      - name: Archive iOS app without signing
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx12g
            -Dfile.encoding=UTF-8
            -XX:MaxMetaspaceSize=2g
          KOTLIN_DAEMON_JVMARGS: -Xmx8g
          NUVIO_IOS_DISTRIBUTION: appstore
        run: |
          set -o pipefail

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nuvio.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Locate archived application
        id: locate-app
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Nuvio.xcarchive"
          APPLICATIONS_PATH="$ARCHIVE_PATH/Products/Applications"
          EXPECTED_APP="$APPLICATIONS_PATH/Nuvio.app"

          if [[ -d "$EXPECTED_APP" ]]; then
            APP_PATH="$EXPECTED_APP"
          else
            APP_PATH="$(
              find "$APPLICATIONS_PATH" \
                -maxdepth 1 \
                -type d \
                -name "*.app" \
                -print \
                -quit 2>/dev/null || true
            )"
          fi

          if [[ -z "${APP_PATH:-}" || ! -d "$APP_PATH" ]]; then
            echo "::error::No application was found in the Xcode archive"

            echo "Archive contents:"
            find "$ARCHIVE_PATH" -maxdepth 6 -print || true

            exit 1
          fi

          echo "Application found at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        env:
          APP_PATH: ${{ steps.locate-app.outputs.app_path }}
        run: |
          set -euo pipefail

          IPA_DIRECTORY="$RUNNER_TEMP/ipa"
          IPA_PATH="$GITHUB_WORKSPACE/Nuvio-unsigned.ipa"

          rm -rf "$IPA_DIRECTORY"
          rm -f "$IPA_PATH"

          mkdir -p "$IPA_DIRECTORY/Payload"

          APP_NAME="$(basename "$APP_PATH")"

          ditto \
            "$APP_PATH" \
            "$IPA_DIRECTORY/Payload/$APP_NAME"

          cd "$IPA_DIRECTORY"

          /usr/bin/zip \
            -qry \
            "$IPA_PATH" \
            Payload

          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error::IPA creation failed"
            exit 1
          fi

          echo "IPA created successfully:"
          ls -lh "$IPA_PATH"

          echo "IPA contents:"
          unzip -l "$IPA_PATH" | head -100

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-unsigned-${{ github.sha }}
          path: Nuvio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-build-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/resolve-packages.log
            ${{ runner.temp }}/xcodebuild.log
            build/reports/problems
          if-no-files-found: ignore
          retention-days: 7
