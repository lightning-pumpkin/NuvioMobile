name: Build iOS IPA

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify MPVKit submodule
        run: |
          set -euo pipefail

          git submodule status
          git submodule update --init --recursive

          if [[ ! -f "MPVKit/Package.swift" ]]; then
            echo "::error::MPVKit/Package.swift was not found"
            echo "Current MPVKit contents:"
            find MPVKit -maxdepth 3 -print || true
            exit 1
          fi

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve Swift packages
        run: |
          set -o pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            | tee "$RUNNER_TEMP/resolve-packages.log"

      - name: Archive iOS app without signing
        env:
          GRADLE_OPTS: >-
            -Xmx12g
            -Dfile.encoding=UTF-8
            -XX:MaxMetaspaceSize=2g
          KOTLIN_DAEMON_JVMARGS: -Xmx8g
        run: |
          set -o pipefail

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nuvio.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/Nuvio.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Nuvio.app"
          IPA_DIRECTORY="$RUNNER_TEMP/ipa"
          IPA_PATH="$GITHUB_WORKSPACE/Nuvio-unsigned.ipa"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Archived app was not found at $APP_PATH"
            echo "Archive contents:"
            find "$ARCHIVE_PATH" -maxdepth 6 -print || true
            exit 1
          fi

          rm -rf "$IPA_DIRECTORY"
          mkdir -p "$IPA_DIRECTORY/Payload"

          cp -R "$APP_PATH" "$IPA_DIRECTORY/Payload/Nuvio.app"

          cd "$IPA_DIRECTORY"
          /usr/bin/zip -qry "$IPA_PATH" Payload

          if [[ ! -f "$IPA_PATH" ]]; then
            echo "::error::IPA creation failed"
            exit 1
          fi

          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-unsigned-${{ github.sha }}
          path: Nuvio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-build-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/resolve-packages.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
