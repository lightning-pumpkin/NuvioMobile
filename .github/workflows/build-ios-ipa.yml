name: Build iOS IPA and Release

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags-ignore:
      - "*"

permissions:
  contents: write

concurrency:
  group: ios-ipa-release
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  NUVIO_IOS_DISTRIBUTION: appstore
  DERIVED_DATA_PATH: ${{ github.workspace }}/.build/DerivedData
  SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.build/SourcePackages

jobs:
  build-ios-ipa:
    name: Build and release unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Generate release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export TZ="Europe/Rome"

          RELEASE_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          VERSION_DATE="$(date '+%Y.%m.%d.%H%M')"

          VERSION="$VERSION_DATE"
          OFFSET=0

          while gh release view "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            >/dev/null 2>&1 ||
            git ls-remote \
              --exit-code \
              --tags \
              origin \
              "refs/tags/$VERSION" \
              >/dev/null 2>&1
          do
            OFFSET=$((OFFSET + 1))

            VERSION="$(
              date \
                -v+"${OFFSET}"M \
                '+%Y.%m.%d.%H%M'
            )"
          done

          IPA_NAME="Nuvio-${VERSION}-unsigned.ipa"
          IPA_PATH="$GITHUB_WORKSPACE/$IPA_NAME"

          echo "Release time: $RELEASE_TIME"
          echo "Release version: $VERSION"
          echo "IPA filename: $IPA_NAME"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_time=$RELEASE_TIME" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Initialize MPVKit submodule
        shell: bash
        run: |
          set -euo pipefail

          git submodule sync -- MPVKit

          git submodule update \
            --init \
            --force \
            --depth 1 \
            --single-branch \
            -- MPVKit

          if [[ ! -f "MPVKit/Package.swift" ]]; then
            echo "::error::MPVKit/Package.swift was not found"

            git submodule status -- MPVKit || true
            find MPVKit -maxdepth 3 -print || true

            exit 1
          fi

          echo "MPVKit commit:"
          git -C MPVKit rev-parse HEAD

      - name: Select latest installed Xcode
        id: xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_PATH="$(
            find /Applications \
              -maxdepth 1 \
              -type d \
              -name 'Xcode*.app' \
              -print |
            sort -V |
            tail -n 1
          )"

          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::No Xcode installation was found"
            exit 1
          fi

          echo "Selecting: $XCODE_PATH"

          sudo xcode-select \
            --switch "$XCODE_PATH/Contents/Developer"

          xcodebuild -version

          SDK_VERSION="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-version
          )"

          echo "iPhoneOS SDK: $SDK_VERSION"

          echo "xcode_path=$XCODE_PATH" >> "$GITHUB_OUTPUT"
          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

          SDK_MAJOR="${SDK_VERSION%%.*}"

          if (( SDK_MAJOR < 26 )); then
            echo "::error::This project requires the iOS 26 SDK or newer."
            echo "::error::Available SDK version is $SDK_VERSION."

            echo "Installed Xcode applications:"

            find /Applications \
              -maxdepth 1 \
              -type d \
              -name 'Xcode*.app' \
              -print |
              sort -V

            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore Kotlin Native cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: >-
            konan-${{ runner.os }}-${{ runner.arch }}-
            ${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Swift package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SOURCE_PACKAGES_PATH }}
          key: >-
            swift-packages-${{ runner.os }}-${{ runner.arch }}-
            ${{ steps.xcode.outputs.sdk_version }}-
            ${{ hashFiles('MPVKit/Package.swift', 'iosApp/**/*.resolved') }}
          restore-keys: |
            swift-packages-${{ runner.os }}-${{ runner.arch }}-
            ${{ steps.xcode.outputs.sdk_version }}-
            swift-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        shell: bash
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NUVIO_REALTIME_SYNC_ENABLED: ${{ secrets.NUVIO_REALTIME_SYNC_ENABLED }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL: ${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          set -euo pipefail

          write_property() {
            local key="$1"
            local value="$2"

            value="${value//$'\n'/}"
            value="${value//$'\r'/}"

            printf '%s=%s\n' "$key" "$value"
          }

          {
            write_property \
              "NUVIO_SUPABASE_URL" \
              "${NUVIO_SUPABASE_URL:-}"

            write_property \
              "NUVIO_SUPABASE_ANON_KEY" \
              "${NUVIO_SUPABASE_ANON_KEY:-}"

            write_property \
              "NUVIO_SUPABASE_FALLBACK_URL" \
              "${NUVIO_SUPABASE_FALLBACK_URL:-}"

            write_property \
              "SENTRY_DSN" \
              "${SENTRY_DSN:-}"

            write_property \
              "NUVIO_REALTIME_SYNC_ENABLED" \
              "${NUVIO_REALTIME_SYNC_ENABLED:-true}"

            write_property \
              "TRAKT_CLIENT_ID" \
              "${TRAKT_CLIENT_ID:-}"

            write_property \
              "TRAKT_CLIENT_SECRET" \
              "${TRAKT_CLIENT_SECRET:-}"

            write_property \
              "TRAKT_REDIRECT_URI" \
              "${TRAKT_REDIRECT_URI:-nuvio://auth/trakt}"

            write_property \
              "INTRODB_API_URL" \
              "${INTRODB_API_URL:-}"

            write_property \
              "IMDB_RATINGS_API_BASE_URL" \
              "${IMDB_RATINGS_API_BASE_URL:-}"

            write_property \
              "IMDB_TAPFRAME_API_BASE_URL" \
              "${IMDB_TAPFRAME_API_BASE_URL:-}"

            write_property \
              "PREMIUMIZE_CLIENT_ID" \
              "${PREMIUMIZE_CLIENT_ID:-}"

            write_property \
              "CONTRIBUTIONS_URL" \
              "${CONTRIBUTIONS_URL:-}"

            write_property \
              "DONATIONS_BASE_URL" \
              "${DONATIONS_BASE_URL:-}"

            write_property \
              "DONATIONS_DONATE_URL" \
              "${DONATIONS_DONATE_URL:-}"
          } > local.properties

          test -s local.properties

          echo "Created local.properties with keys:"
          sed 's/=.*$/=<redacted>/' local.properties

      - name: Verify build inputs
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "gradlew"
            "local.properties"
            "MPVKit/Package.swift"
            "iosApp/iosApp.xcodeproj/project.pbxproj"
            "iosApp/iosApp.xcodeproj/xcshareddata/xcschemes/iosApp.xcscheme"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -e "$file" ]]; then
              echo "::error::Required file not found: $file"
              exit 1
            fi
          done

      - name: Build iOS application
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Xmx8g
            -Dfile.encoding=UTF-8
            -Dorg.gradle.daemon=false
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
          KOTLIN_DAEMON_JVMARGS: -Xmx6g
        run: |
          set -euo pipefail
          set -o pipefail

          mkdir -p \
            "$DERIVED_DATA_PATH" \
            "$SOURCE_PACKAGES_PATH"

          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ONLY_ACTIVE_ARCH=YES \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Locate built application
        id: locate-app
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTS_PATH="$DERIVED_DATA_PATH/Build/Products/Release-iphoneos"
          EXPECTED_APP="$PRODUCTS_PATH/Nuvio.app"

          if [[ -d "$EXPECTED_APP" ]]; then
            APP_PATH="$EXPECTED_APP"
          else
            APP_PATH="$(
              find "$PRODUCTS_PATH" \
                -maxdepth 1 \
                -type d \
                -name '*.app' \
                ! -name '*Tests.app' \
                -print \
                -quit 2>/dev/null || true
            )"
          fi

          if [[ -z "${APP_PATH:-}" || ! -d "$APP_PATH" ]]; then
            echo "::error::No iOS application was produced"

            echo "Build products:"

            find \
              "$DERIVED_DATA_PATH/Build/Products" \
              -maxdepth 4 \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Application found at: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package unsigned IPA
        shell: bash
        env:
          APP_PATH: ${{ steps.locate-app.outputs.app_path }}
          IPA_PATH: ${{ steps.version.outputs.ipa_path }}
        run: |
          set -euo pipefail

          IPA_ROOT="$RUNNER_TEMP/ipa"
          APP_NAME="$(basename "$APP_PATH")"

          rm -rf "$IPA_ROOT"
          rm -f "$IPA_PATH"

          mkdir -p "$IPA_ROOT/Payload"

          ditto \
            "$APP_PATH" \
            "$IPA_ROOT/Payload/$APP_NAME"

          cd "$IPA_ROOT"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "$IPA_PATH"

          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error::IPA creation failed"
            exit 1
          fi

          echo "IPA created:"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TIME: ${{ steps.version.outputs.release_time }}
          IPA_PATH: ${{ steps.version.outputs.ipa_path }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"

          {
            echo "## Nuvio iOS"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- Built: $RELEASE_TIME"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
            echo
            echo "This release contains an unsigned iOS IPA."
          } > "$RELEASE_NOTES"

          gh release create "$RELEASE_VERSION" \
            "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nuvio $RELEASE_VERSION" \
            --notes-file "$RELEASE_NOTES" \
            --latest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-build-log-${{ github.sha }}
          path: |
            ${{ runner.temp }}/xcodebuild.log
            build/reports/problems
          if-no-files-found: ignore
          retention-days: 7
