name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp

      - name: Archive iOS app without signing
        env:
          GRADLE_OPTS: -Xmx12g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2g
          KOTLIN_DAEMON_JVMARGS: -Xmx8g
        run: |
          set -o pipefail

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Nuvio.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/Nuvio.xcarchive/Products/Applications/Nuvio.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Archived app not found at $APP_PATH"
            find "$RUNNER_TEMP/Nuvio.xcarchive" -maxdepth 5 -print || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Nuvio.app"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Nuvio-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-unsigned-${{ github.sha }}
          path: Nuvio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-xcodebuild-log-${{ github.sha }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
